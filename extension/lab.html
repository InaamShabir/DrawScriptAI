<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawScript Lab</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<header class="lab-top">
  <span class="ds3d-logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.2 6.4 3.5L12 11.2 5.6 7.7 12 4.2zM5 9.4l6 3.3v6.6l-6-3.3V9.4zm8 9.9v-6.6l6-3.3v6.6l-6 3.3z"/></svg></span>
  <h1>DrawScript Lab</h1>
  <nav>
    <button class="tab on" data-tab="ask">Ask AI</button>
    <button class="tab" data-tab="paste">Paste script</button>
    <button class="tab" data-tab="library">Library <b id="libCount">0</b></button>
    <button class="tab" data-tab="setup">AI setup</button>
    <a class="tab" href="popup.html?tab=1">Settings</a>
  </nav>
</header>
<main class="lab-main">
  <section class="lab-left">
    <div class="pane" data-pane="ask">
      <label for="q">What do you want to learn?</label>
      <textarea id="q" rows="3" placeholder="e.g. Explain work done on an inclined plane"></textarea>
      <div class="chips" id="samples"></div>
      <button id="go" class="go">Create lesson</button>
      <p id="askMsg" class="hint" role="status"></p>
    </div>
    <div class="pane" data-pane="paste" hidden>
      <label for="paste">Paste a DrawScript (from ChatGPT, Claude or anywhere)</label>
      <textarea id="paste" rows="9" spellcheck="false" placeholder="Narration and \(commands\) …"></textarea>
      <button id="drawPaste" class="go">Draw it</button>
    </div>
    <div class="pane" data-pane="library" hidden>
      <div id="libList" class="lib"></div>
      <button id="libClear" class="ghost">Delete all saved lessons</button>
    </div>
    <div class="pane" data-pane="setup" hidden>
      <p class="hint">Create lessons without ChatGPT using your own free key. The key stays in this browser and is only sent to the provider you choose.</p>
      <label for="provider">Provider</label>
      <select id="provider"><option value="gemini">Google Gemini (free tier)</option><option value="openai">OpenAI</option></select>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste key">
      <label for="model">Model (optional)</label>
      <input id="model" type="text" spellcheck="false" placeholder="gemini-2.0-flash / gpt-4o-mini">
      <p class="hint" id="keyHelp"></p>
    </div>
  </section>
  <section class="lab-right"><div id="playerHost"></div></section>
</main>
<script src="prompt.js"></script>
<script src="library.js"></script>
<script src="engine.js"></script>
<script src="player.js"></script>
<script src="lab.js"></script>
</body>
</html>
