<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawScript 3D</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.2 6.4 3.5L12 11.2 5.6 7.7 12 4.2zM5 9.4l6 3.3v6.6l-6-3.3V9.4zm8 9.9v-6.6l6-3.3v6.6l-6 3.3z"/></svg></span>
    <div><h1>DrawScript 3D</h1><p>Turn ChatGPT &amp; Claude answers into animated 3D lessons.</p></div>
  </header>

  <div class="quick">
    <button id="draw" class="pri">Draw latest reply on this page</button>
    <button id="studio">Open Studio</button>
    <button id="copyPrompt">Copy prompt</button>
  </div>
  <p id="msg" class="msg" role="status"></p>

  <section>
    <h2>Behaviour</h2>
    <label class="row"><span>Auto-draw when a reply finishes<small>Opens the canvas by itself</small></span><input type="checkbox" id="autoDraw"></label>
    <label class="row"><span>“Ask &amp; Draw” also presses Send<small>Off = just insert the prompt</small></span><input type="checkbox" id="autoSend"></label>
    <label class="row"><span>Show captions<small>Narration text under the canvas</small></span><input type="checkbox" id="captions"></label>
  </section>

  <section>
    <h2>Voice</h2>
    <label class="row"><span>Read narration aloud</span><input type="checkbox" id="ttsEnabled"></label>
    <label class="col"><span>Voice</span><select id="voiceName"></select></label>
    <label class="col"><span>Voice speed <b id="rateV"></b></span><input type="range" id="voiceRate" min="0.6" max="1.8" step="0.1"></label>
    <label class="col"><span>Volume <b id="volV"></b></span><input type="range" id="voiceVolume" min="0" max="1" step="0.05"></label>
    <button id="testVoice" class="ghost">Test voice</button>
  </section>

  <section>
    <h2>Canvas</h2>
    <label class="col"><span>Animation speed</span>
      <select id="speed"><option value="0.5">0.5× slow</option><option value="1">1× normal</option><option value="1.5">1.5×</option><option value="2">2× fast</option><option value="3">3× very fast</option></select></label>
    <label class="col"><span>Theme</span>
      <select id="theme"><option value="dark">Dark</option><option value="chalkboard">Chalkboard</option><option value="blueprint">Blueprint</option><option value="paper">Paper (light)</option></select></label>
    <label class="col"><span>Window</span>
      <select id="overlayMode"><option value="floating">Floating panel</option><option value="fullscreen">Fullscreen</option></select></label>
    <label class="col"><span>Dock position</span>
      <select id="dockSide"><option value="right">Right</option><option value="left">Left</option></select></label>
  </section>

  <section>
    <h2>Lesson prompt</h2>
    <label class="col"><span>Subject</span>
      <select id="subject"><option value="any">Any</option><option value="math">Maths</option><option value="physics">Physics</option><option value="geometry">Geometry</option><option value="stats">Statistics</option><option value="science">Science</option></select></label>
    <label class="col"><span>Level</span>
      <select id="level"><option value="auto">Auto</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label>
    <label class="col"><span>Length</span>
      <select id="length"><option value="short">Short</option><option value="medium">Medium</option><option value="detailed">Detailed</option></select></label>
    <label class="col"><span>Narration language</span>
      <select id="language"><option>English</option><option>Hindi</option><option>Urdu</option><option>Spanish</option><option>French</option><option>German</option><option>Arabic</option><option>Portuguese</option><option>Chinese</option><option>Japanese</option></select></label>
    <label class="col"><span>Extra instructions (optional)</span><textarea id="extra" rows="2" placeholder="e.g. Use real-world examples"></textarea></label>
  </section>

  <section>
    <h2>Studio</h2>
    <label class="col"><span>Studio URL</span><input type="text" id="appUrl" placeholder="https://…" spellcheck="false"></label>
  </section>

  <footer><button id="reset" class="ghost">Reset to defaults</button><span id="ver"></span></footer>
</main>
<script src="prompt.js"></script>
<script src="popup.js"></script>
</body>
</html>
